name: karachords
description: "Smart karaoke for guitarists with dynamic chord and lyrics highlighting."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  flutter_sound: ^9.4.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  speech_to_text: ^7.4.0
  whisper_flutter_new: ^1.0.1
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true

  assets:
    - assets/songs/
